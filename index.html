<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قلبي وروحي يسرى</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            padding: 30px;
            text-align: center;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        h1 {
            color: #e91e63;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            color: #9c27b0;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        
        .photo-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #e91e63;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .love-messages {
            margin-bottom: 30px;
        }
        
        .message {
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            padding: 15px;
            margin: 15px 0;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            font-size: 1.5rem;
            color: #d81b60;
            font-weight: bold;
            transition: transform 0.3s;
        }
        
        .message:hover {
            transform: scale(1.03);
        }
        
        .special-message {
            background: linear-gradient(45deg, #e91e63, #9c27b0);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 30px;
            font-size: 1.3rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .hearts {
            font-size: 2rem;
            color: #e91e63;
            margin: 20px 0;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .footer {
            margin-top: 20px;
            color: #9c27b0;
            font-size: 1.1rem;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .message {
                font-size: 1.2rem;
            }
            
            .special-message {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>قلبي وروحي يسرى</h1>
            <div class="subtitle">اسمحيلي اذا زعفتك ولا غلطت معاك</div>
        </div>
        
        <div class="photo-container">
            <img src="photo_2025-11-21_14-41-44.jpg" alt="صورة يسرى">
        </div>
        
        <div class="love-messages">
            <div class="message">نحبببببببببببببك</div>
            <div class="message">ونبغيييييييييييييك</div>
            <div class="message">موااااااااااااح</div>
            <div class="message">نموت عليك</div>
        </div>
        
        <div class="hearts">❤️ ❤️ ❤️</div>
        
        <div class="special-message">
            متتبسميش وحدك! 😊
        </div>
        
        <div class="footer">
            مشي ساهلة باه خدمتو يااااو
        </div>
    </div>

    <script>
        // إضافة تأثيرات تفاعلية بسيطة
        document.addEventListener('DOMContentLoaded', function() {
            const messages = document.querySelectorAll('.message');
            
            messages.forEach(message => {
                message.addEventListener('click', function() {
                    this.style.background = 'linear-gradient(45deg, #e91e63, #9c27b0)';
                    this.style.color = 'white';
                    
                    setTimeout(() => {
                        this.style.background = 'linear-gradient(45deg, #ff9a9e, #fad0c4)';
                        this.style.color = '#d81b60';
                    }, 1000);
                });
            });
            
            // إضافة قلوب متحركة بشكل عشوائي
            setInterval(createHeart, 500);
            
            function createHeart() {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'fixed';
                heart.style.fontSize = Math.random() * 20 + 10 + 'px';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-50px';
                heart.style.opacity = Math.random() * 0.5 + 0.5;
                heart.style.zIndex = '-1';
                heart.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }
            
            // إضافة أنماط CSS للقلوب المتساقطة
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fall {
                    to {
                        transform: translateY(100vh) rotate(360deg);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
